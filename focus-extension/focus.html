<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Focus with Pip · Boilerplate</title>
    <link rel="stylesheet" href="focus.css" />
  </head>
  <body>
    <main>
      <a
        class="brand"
        id="home"
        href="https://boilerplate.select/boiler"
        target="_blank"
        rel="noopener"
        >BOILERPLATE</a
      >
      <section>
        <h1 id="heading">Time to come back.</h1>
        <p id="description">
          You protected a little time for something that matters.
        </p>
        <div id="timer" aria-label="Focus time remaining"></div>
        <p id="task"></p>
        <p id="goal"></p>
        <a
          id="assistant"
          class="primary"
          href="https://boilerplate.select/boiler"
          target="_blank"
          rel="noopener"
          >Back to Pip</a
        ><button id="release">End focus · emergency release</button>
        <p id="status" role="status"></p>
      </section>
      <p class="note">
        Your assistant stays available. Other apps and devices remain
        accessible.
      </p>
    </main>
    <script src="focus.js"></script>
  </body>
</html>
