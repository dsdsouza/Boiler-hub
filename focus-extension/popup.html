<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pip · Boilerplate</title>
    <link rel="stylesheet" href="focus.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="icon128.png" width="44" height="44" alt="" />
        <a class="brand" id="home" href="https://boilerplate.select/boiler" target="_blank" rel="noopener">Pip · Boilerplate</a>
      </header>
      <div class="focus-summary">
        <p id="focus-status" role="status"></p>
        <a id="open-pip" href="https://boilerplate.select/boiler" target="_blank" rel="noopener">
          Open Pip
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 12 12 4M4 4h8v8" /></svg>
        </a>
      </div>
      <h1>Import your coursework?</h1>
      <p class="intro">Bring your calendar and deadlines into Boilerplate so Pip can plan with them.</p>
      <label for="provider">School calendar</label>
      <select id="provider">
        <option>Brightspace</option><option>Canvas</option><option>Moodle</option><option>Blackboard</option><option value="Other">Another calendar</option>
      </select>
      <p id="steps"></p>
      <button class="primary" id="scan" type="button">Find calendar links on this page</button>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="navigation"></div>
      <div id="results"></div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
