name: Authenticated QA

# Credentials are available only to an explicitly dispatched run of trusted main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-authenticated
  cancel-in-progress: false

jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: https://boilerplate.select
      QA_EXPECTED_SUPABASE_URL: https://dtnjfycvhbbhzfkfnfio.supabase.co
      QA_ACCOUNT_BANK: .qa/credentials-regression.json
      QA_NAMESPACE: regression
      QA_AUTH_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Prepare private QA sessions
        env:
          QA_ACCOUNT_BANK_JSON: ${{ secrets.QA_ACCOUNT_BANK_JSON }}
          QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
        run: |
          node scripts/qa/ci-accounts.mjs
          pnpm qa:session --all
      - name: Verify all 32 accounts and privacy contracts
        run: pnpm test:e2e:auth
      - name: Finish live personal workflows and verify restoration
        run: pnpm test:workflows:live journey.spec.ts --workers=4
        env:
          QA_SUPABASE_URL: https://dtnjfycvhbbhzfkfnfio.supabase.co
          QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
          QA_WORKFLOW_REPORT_DIR: qa-runs/live-workflows
          QA_WORKFLOW_RUN_ID: ci-live-${{ github.run_id }}
          QA_WORKFLOW_COVERAGE: Live boilerplate.select personal workflows and signed-in UI using the existing synthetic identities; task and status restoration verified.
      - name: Inspect signed-in UI without competing account writes
        run: pnpm test:workflows:live ui.spec.ts --workers=2
        env:
          QA_WORKFLOW_REPORT_DIR: qa-runs/live-ui
          QA_WORKFLOW_RUN_ID: ci-live-ui-${{ github.run_id }}
          QA_WORKFLOW_COVERAGE: Live boilerplate.select signed-in UI at desktop, tablet and phone widths; private account diagnostics are not uploaded.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-workflow-summary
          path: |
            qa-runs/live-workflows
            qa-runs/live-ui
          retention-days: 7
      - name: Remove private browser sessions
        if: always()
        run: node -e "for (const path of ['.qa', 'test-results-auth']) require('node:fs').rmSync(path, { recursive:true, force:true })"
