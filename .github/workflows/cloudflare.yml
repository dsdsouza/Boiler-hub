name: Deploy Boilerplate to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 831d31b4049fece76716fe9529e28a4c
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: pnpm build:cloudflare
      - name: Check this commit is still main
        id: main-head
        run: |
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$GITHUB_SHA" = "$current_main" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $GITHUB_SHA because main is now $current_main."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to zhomander
        if: steps.main-head.outputs.deploy == 'true'
        run: pnpm deploy:cloudflare --tag "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
