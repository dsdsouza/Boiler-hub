name: Boilerplate QA

on:
  push:
    branches: [main, staging, 'staging-*', 'staging/**']
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Types, lint and database contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen
      - run: pnpm typecheck && pnpm lint && pnpm test

  browsers:
    name: Browsers (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://qa-project.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: qa-anon-placeholder
      PLAYWRIGHT_PRODUCTION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/3
      - run: pnpm test:components --shard=${{ matrix.shard }}/3
      - name: Complete workflow journeys with step diagnostics
        run: pnpm test:workflows --shard=${{ matrix.shard }}/3
        env:
          QA_WORKFLOW_REPORT_DIR: qa-runs/ci-workflows
          QA_WORKFLOW_RUN_ID: ci-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-report-${{ matrix.shard }}
          path: qa-runs/ci-workflows
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures-${{ matrix.shard }}
          path: |
            test-results
            .qa/component-artifacts
          retention-days: 14

  cloudflare-build:
    name: Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://qa-project.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: qa-anon-placeholder
      WRANGLER_SEND_METRICS: 'false'
      PLAYWRIGHT_CLOUDFLARE: '1'
      PLAYWRIGHT_PORT: '3240'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cf-typegen
      - run: pnpm build:cloudflare
      - run: pnpm exec wrangler deploy --dry-run
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify the Workers runtime and static cache
        run: |
          pnpm test:e2e --project=desktop-chromium --workers=2 --retries=0 --reporter=list 2>&1 | tee cloudflare-runtime.log
          node -e 'const log = require("node:fs").readFileSync("cloudflare-runtime.log", "utf8"); if (/StaticAssetsIncrementalCache: Failed to (set|delete)/.test(log)) throw new Error("Read-only static cache write regression");'

  report:
    if: ${{ !cancelled() }}
    needs: browsers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: playwright-report
          retention-days: 14

  qa-gate:
    name: QA gate
    if: ${{ always() }}
    needs: [contracts, browsers, cloudflare-build, report]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every QA job to succeed
        env:
          CONTRACTS: ${{ needs.contracts.result }}
          BROWSERS: ${{ needs.browsers.result }}
          REPORT: ${{ needs.report.result }}
          CLOUDFLARE_BUILD: ${{ needs.cloudflare-build.result }}
        run: |
          test "$CONTRACTS" = success
          test "$BROWSERS" = success
          test "$REPORT" = success
          test "$CLOUDFLARE_BUILD" = success
